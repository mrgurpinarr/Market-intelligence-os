version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: market_intel_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-market_intelligence}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - market_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: mrgurpinar/market-intelligence-web:latest
    container_name: market_intel_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-market_intelligence}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CMC_API_KEY=${CMC_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    depends_on:
      - postgres
    networks:
      - market_net

  telegram-bot:
    build:
      context: .
      dockerfile: apps/telegram-bot/Dockerfile
    image: mrgurpinar/market-intelligence-telegram-bot:latest
    container_name: market_intel_telegram_bot
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-market_intelligence}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_REPORT_CHAT_ID=${TELEGRAM_REPORT_CHAT_ID}
      - CMC_API_KEY=${CMC_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    depends_on:
      - postgres
    networks:
      - market_net

volumes:
  pgdata:

networks:
  market_net:
    driver: bridge
